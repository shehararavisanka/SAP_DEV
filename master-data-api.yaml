# ==============================================================
# COMPONENTS
# ==============================================================

components:

  # ============================================================
  # SECURITY
  # ============================================================

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT Bearer authentication.

        First authenticate using POST /api/auth, then enter the returned
        JWT token in the Swagger Authorize dialog.


  # ============================================================
  # PARAMETERS
  # ============================================================

  parameters:

    FromDate:
      name: FromDate
      in: query
      required: true

      description: >
        Start date of the filter range (inclusive).
        Format: yyyy-MM-dd.

      schema:
        type: string
        format: date
        example: "2026-01-01"


    ToDate:
      name: ToDate
      in: query
      required: true

      description: >
        End date of the filter range (inclusive).
        Format: yyyy-MM-dd.

      schema:
        type: string
        format: date
        example: "2026-01-31"


  # ============================================================
  # SCHEMAS
  # ==============================================================

  schemas:

    # ----------------------------------------------------------
    # Authentication
    # ----------------------------------------------------------

    LoginRequest:
      type: object

      required:
        - username
        - password

      properties:

        username:
          type: string
          description: Username used for authentication.
          example: "SapUser"

        password:
          type: string
          format: password
          description: Password used for authentication.
          example: "Usr@2026"


    LoginResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          type: object

          properties:

            token:
              type: string
              description: JWT access token.
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

        message:
          type: string
          nullable: true
          example: "Authentication successful."


    # ----------------------------------------------------------
    # Generic Error
    # ----------------------------------------------------------

    ErrorResponse:
      type: object

      properties:

        success:
          type: boolean
          example: false

        data:
          type: array
          items: {}

        message:
          type: string
          example: "FromDate is required."


    # ----------------------------------------------------------
    # Generic Placeholder Record
    # ----------------------------------------------------------

    PlaceholderRecord:
      type: object

      description: >
        Generic record shape. Actual fields can be added when the
        corresponding entity definitions are available.

      properties:

        id:
          type: integer
          example: 1

        name:
          type: string
          example: "Example"

      additionalProperties: true


    # ----------------------------------------------------------
    # BPMaster
    # ----------------------------------------------------------

    BPMasterSelectAllResponse:
      type: object

      properties:
        success:
          type: boolean
          example: true

        data:
          type: array
          items:
            $ref: '#/components/schemas/PlaceholderRecord'

        message:
          type: string
          nullable: true
          example: null


