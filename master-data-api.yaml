components:
  parameters:
    FromDate:
      name: FromDate
      in: query
      required: true
      description: >
        Start date of the filter range (inclusive). Format: yyyy-MM-dd.
      schema:
        type: string
        format: date
        example: "2026-01-01"
    ToDate:
      name: ToDate
      in: query
      required: true
      description: >
        End date of the filter range (inclusive). Format: yyyy-MM-dd.
      schema:
        type: string
        format: date
        example: "2026-01-31"
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: array
          items: {}
          example: []
        message:
          type: string
          example: "FromDate is required."
    PlaceholderRecord:
      type: object
      description: >
        Generic placeholder record shape. Actual fields are unknown because the
        table/entity schema was not supplied — replace with the real entity
        definition when available.
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Example"
      additionalProperties: true
    BPMasterSelectAllResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlaceholderRecord'
        message:
          type: string
          nullable: true
          example: null
    BPMasterSelectByDateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlaceholderRecord'
        message:
          type: string
          nullable: true
          example: null
    ItemMasterSelectAllResponse:
