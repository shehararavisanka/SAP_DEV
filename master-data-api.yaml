openapi: 3.0.3
info:
  title: Master Data API
  description: >
    APIs for retrieving master data records for BPMaster, ItemMaster, Warehouse,
    HouseBankAccounts, CostCenter, SalesEmployees, and Users.
    Each table exposes two GET endpoints: a "Select All" endpoint that returns
    every record, and a "SelectByDate" endpoint that filters records by a
    FromDate/ToDate range.

    NOTE: The actual database/entity schema was not provided for this request.
    The date column used internally for SelectByDate filtering (e.g. CreatedDate,
    UpdatedDate, etc.) for each table is therefore marked as "requiring
    confirmation" in the relevant endpoint description, and the response schemas
    below use a generic placeholder record shape. Replace the placeholder schema
    properties with the real entity fields once the table definitions are
    available.
  version: 1.0.0
servers:
  - url: http://localhost:4500
    description: Local development server (HTTPS)
tags:
  - name: BPMaster
    description: Master data operations for the BPMaster table.
  - name: ItemMaster
    description: Master data operations for the ItemMaster table.
  - name: Warehouse
    description: Master data operations for the Warehouse table.
  - name: HouseBankAccounts
    description: Master data operations for the HouseBankAccounts table.
  - name: CostCenter
    description: Master data operations for the CostCenter table.
  - name: SalesEmployees
    description: Master data operations for the SalesEmployees table.
  - name: Users
    description: Master data operations for the Users table.

paths:
  /api/BPMaster/Select/ALL:
    get:
      tags:
        - BPMaster
      summary: Select all BPMaster records
      description: >
        Returns all available records from the BPMaster table. No filtering is
        applied.
      operationId: getBPMasterSelectAll
      responses:
        '200':
          description: OK. Returns all BPMaster records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BPMasterSelectAllResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal Server Error. Unexpected server or database error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/BPMaster/SelectByDate:
    get:
      tags:
        - BPMaster
      summary: Select BPMaster records by date range
      description: >
        Returns BPMaster records whose applicable date field falls within the
        inclusive range [FromDate, ToDate]. The exact date column used for
        filtering (e.g. CreatedDate or UpdatedDate) is NOT confirmed for this
        table, since the BPMaster entity/table schema was not provided —
        requires confirmation against the actual database schema before
        implementation.
      operationId: getBPMasterSelectByDate
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: OK. Returns BPMaster records within the specified date range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BPMasterSelectByDateResponse'
        '400':
          description: >
            Bad Request. Returned when FromDate or ToDate is missing, the date
            format is invalid, or FromDate is greater than ToDate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal Server Error. Unexpected server or database error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

