openapi: 3.0.3

info:
  title: Master Data API
  description: >
    APIs for authentication and retrieving master data and document data.

    Authentication is performed using POST /api/auth. The returned JWT token
    must be supplied as a Bearer token for all protected endpoints.

    Each master-data/document table exposes two GET endpoints:
    - Select All: returns every record.
    - SelectByDate: filters records by a FromDate/ToDate range.

  version: 1.0.0

servers:
  - url: http://10.0.0.4:4500
    description: Master Data API server

tags:

  - name: Authentication
    description: Authentication and authorization operations.

  - name: BPMaster
    description: Master data operations for the BPMaster table.

  - name: ItemMaster
    description: Master data operations for the ItemMaster table.

  - name: Warehouse
    description: Master data operations for the Warehouse table.

  - name: HouseBankAccounts
    description: Master data operations for the HouseBankAccounts table.

  - name: CostCenter
    description: Master data operations for the CostCenter table.

  - name: SalesEmployees
    description: Master data operations for the SalesEmployees table.

  - name: Users
    description: Master data operations for the Users table.

  - name: SalesQuotation
    description: Sales quotation document operations.

  - name: SalesOrder
    description: Sales order document operations.

  - name: Delivery
    description: Delivery document operations.

  - name: Inventory
    description: Inventory document operations.

  - name: Return
    description: Return document operations.

  - name: ARInvoice
    description: A/R Invoice document operations.

  - name: ARCreditMemo
    description: A/R Credit Memo document operations.

  - name: IncomingPayment
    description: Incoming Payment document operations.

  - name: InventoryTransfer
    description: Inventory Transfer document operations.


security:
  - bearerAuth: []


paths:

  # ============================================================
  # AUTHENTICATION
  # ============================================================

  /api/auth:
    post:
      security: []
      tags:
        - Authentication

      summary: Authenticate user

      description: >
        Authenticates a user using username and password and returns a JWT
        authentication token.

      operationId: authenticateUser

      servers:
        - url: http://10.0.0.4:4500
          description: Authentication server

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

            example:
              username: "SapUser"
              password: "Usr@2026"

      responses:

        '200':
          description: Authentication successful.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

              example:
                success: true
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                message: "Authentication successful."

        '400':
          description: Bad Request.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Invalid username or password.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal Server Error.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  # ============================================================
  # BPMaster
  # ============================================================

  /api/BPMaster/Select/ALL:
    get:
      tags:
        - BPMaster

      summary: Select all BPMaster records

      description: Returns all available records from the BPMaster table.

      operationId: getBPMasterSelectAll

      responses:

        '200':
          description: OK.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BPMasterSelectAllResponse'

        '400':
          description: Bad Request.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Unauthorized.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal Server Error.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /api/BPMaster/SelectByDate:
    get:
      tags:
        - BPMaster

      summary: Select BPMaster records by date range

      description: >
        Returns BPMaster records within the specified FromDate and ToDate range.

      operationId: getBPMasterSelectByDate

      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'

      responses:

        '200':
          description: OK.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BPMasterSelectByDateResponse'

        '400':
          description: Bad Request.

          content:
            application/json:
              schema:
